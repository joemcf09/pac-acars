<!doctype html>
<html lang="en" data-design="loadsheet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAC ACARS</title>
<link rel="icon" href="/static/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..125,300..800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--red:#C80000;--bg:#15171b;--panel:#1E2126;--line:#2e3239;--text:#E8EAED;--dim:#8E96A3;--green:#4BD07F;--amber:#FFC845;--cyan:#7CC4FF;
  --font:"Saira",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-stretch:95%;font-size:14px}
header{display:flex;align-items:center;gap:10px;background:var(--red);padding:10px 14px}
header img{height:22px}
header b{font-size:15px;letter-spacing:.06em;font-stretch:120%}
header .sp{flex:1}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#888;margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--green)}.dot.bad{background:#ff6b6b}.dot.warn{background:var(--amber)}
main{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px}
.flight{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.fn{font-size:26px;font-weight:800;font-stretch:120%;line-height:1}
.route{font-size:18px;font-weight:700;font-stretch:115%}
.muted{color:var(--dim)}
.small{font-size:12px}
button,select,input,textarea{font:inherit}
.btn{background:var(--red);color:#fff;border:0;border-radius:3px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid #4a4f58;color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea{background:#101215;color:var(--text);border:1px solid var(--line);border-radius:3px;padding:7px 9px}
.phase{display:flex;align-items:center;justify-content:space-between;background:#101215;border-radius:3px;padding:8px 10px}
.phase b{font-size:17px;color:#fff;font-stretch:115%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.grid div{background:var(--panel);padding:8px 10px}
.grid span{display:block;font-size:11px;color:var(--dim)}
.grid b{font-size:19px;font-variant-numeric:tabular-nums}
.oooi{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-family:var(--mono);font-size:13px}
.oooi span{display:block;font-family:var(--font);font-size:11px;color:var(--dim)}
.log{background:#0c0d10;border-radius:3px;font-family:var(--mono);font-size:12px;line-height:1.45;max-height:300px;overflow:auto;padding:8px 10px}
.log div{display:grid;grid-template-columns:44px 1fr;gap:6px;border-bottom:1px solid #1a1c20;padding:3px 0}
.log .z{color:var(--dim)}
.log .phase-m{color:#ff8a8a}.log .oooi-m{color:#fff;font-weight:600}.log .warn{color:var(--amber)}.log .wx{color:var(--cyan)}
.log .dl{color:#fff}.log .dl::before{content:"▲ ";color:var(--dim)}.log .ul{color:#7CE3A1}.log .ul::before{content:"▼ "}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tabs button{background:#101215;color:var(--text);border:1px solid var(--line);border-radius:3px;padding:5px 9px;cursor:pointer;font-size:12.5px}
.tabs button.on{background:var(--text);color:#111}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mform .full{grid-column:1/-1}
.mform label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.mform input,.mform select{width:100%}
.notice{border-left:4px solid var(--amber);background:#2a2618;padding:8px 10px;border-radius:2px;font-size:13px}
.notice.err{border-color:#ff6b6b;background:#2b1a1a}
.notice.ok{border-color:var(--green);background:#15271c}
.grade{font-size:48px;font-weight:800;font-stretch:120%;line-height:1}
details summary{cursor:pointer;color:var(--dim);font-size:13px}
.hidden{display:none!important}
/* MSG light, compact toggle */
.hbtn{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:3px;padding:3px 8px;font:700 11px var(--font);letter-spacing:.08em;cursor:pointer}
.msg-light{background:#3a2f10;border-color:#8a6d1e;color:#6b5a2a}
.msg-light.on{background:var(--amber);color:#1a1300;border-color:#fff;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.msg-light.on{animation:none}}
/* flight plan */
.ofp{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.ofp div{background:var(--panel);padding:6px 8px}.ofp span{display:block;font-size:10.5px;color:var(--dim)}.ofp b{font-size:14px;font-variant-numeric:tabular-nums}
.route{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:8px;word-break:break-word}
/* landing card */
.lcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin:8px 0}
.lrate{font-size:40px;font-weight:800;font-stretch:120%;line-height:1}
.lverdict{font-weight:700;letter-spacing:.08em;font-size:12px}
.lfacts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:12.5px}
.lfacts b{color:#fff}
.gbadge{display:inline-grid;place-items:center;width:46px;height:46px;background:var(--red);font-size:28px;font-weight:800;border-radius:3px}
/* compact strip */
#strip{display:none}
body.compact header, body.compact main > :not(#strip){display:none!important}
body.compact main{padding:6px}
body.compact #strip{display:block}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.strip .top{display:flex;align-items:center;gap:8px}
.strip .top b{font-stretch:115%}
.strip .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0;font-variant-numeric:tabular-nums}
.strip .nums span{display:block;font-size:10px;color:var(--dim)}.strip .nums b{font-size:17px}
.strip .last{font-family:var(--mono);font-size:11.5px;color:#7CE3A1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------------- Load Sheet design (matches the website): solid Big Shoulders markings, Barlow, square paperwork ---------------- */
@font-face{font-family:"Barlow";src:url("/static/fonts/barlow-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url("/static/fonts/barlow-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow";src:url("/static/fonts/barlow-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow";src:url("/static/fonts/barlow-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Big Shoulders Display";src:url("/static/fonts/big-shoulders-display.woff2") format("woff2");font-weight:100 900;font-display:swap}
html[data-design="loadsheet"]{--font:"Barlow","Segoe UI",system-ui,sans-serif;--display:"Big Shoulders Display","Barlow",Impact,sans-serif}
html[data-design="loadsheet"] body{font-family:var(--font);font-stretch:100%;font-size:14.5px}
html[data-design="loadsheet"] header{background:var(--panel);padding:0 12px 0 0;border-bottom:1px solid var(--line);gap:8px}
html[data-design="loadsheet"] header .brandblk{display:flex;align-items:center;gap:8px;background:var(--red);padding:11px 14px;align-self:stretch}
html[data-design="loadsheet"] header b{font:700 14px var(--font);letter-spacing:.04em}
html[data-design="loadsheet"] .fn,html[data-design="loadsheet"] .route,html[data-design="loadsheet"] .phase b,
html[data-design="loadsheet"] #sFn,html[data-design="loadsheet"] .lrate{font-family:var(--display);font-stretch:100%;font-weight:800;letter-spacing:.02em}
html[data-design="loadsheet"] .fn{font-size:34px}
html[data-design="loadsheet"] .route{font-size:22px;color:var(--text)}
html[data-design="loadsheet"] .phase b{font-size:22px}
html[data-design="loadsheet"] #sFn{font-size:22px}
html[data-design="loadsheet"] .lrate{font-size:48px}
html[data-design="loadsheet"] .card,html[data-design="loadsheet"] .btn,html[data-design="loadsheet"] .hbtn,html[data-design="loadsheet"] .grid,
html[data-design="loadsheet"] .phase,html[data-design="loadsheet"] select,html[data-design="loadsheet"] input,html[data-design="loadsheet"] textarea,
html[data-design="loadsheet"] .strip,html[data-design="loadsheet"] .ofp,html[data-design="loadsheet"] .gbadge{border-radius:0}
html[data-design="loadsheet"] .card{border-left:3px solid var(--line)}
html[data-design="loadsheet"] #flightCard{border-left-color:var(--red)}
html[data-design="loadsheet"] .grid span,html[data-design="loadsheet"] .ofp span{font-size:11.5px}
html[data-design="loadsheet"] .grid b,html[data-design="loadsheet"] .ofp b{font-stretch:100%}
/* ---------------- 1.1: splash, update, landing debrief ---------------- */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-brand{display:flex;align-items:center;gap:12px}
#splash img{height:44px}
#splash b{font:800 22px/1 var(--display,var(--font));letter-spacing:.14em;color:#fff}
#splash .sp-bar{width:180px;height:3px;background:var(--line);overflow:hidden;border-radius:2px}
#splash .sp-bar i{display:block;height:100%;width:40%;background:var(--red);animation:spbar 1.1s ease-in-out infinite}
@keyframes spbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#splash .sp-status{font:500 12px var(--mono);color:var(--dim);letter-spacing:.04em;min-height:1.2em}
#splash .sp-ver{position:absolute;bottom:14px;font:500 11px var(--mono);color:#5c626c}
@media (prefers-reduced-motion:reduce){#splash .sp-bar i{animation:none;width:100%}#splash{transition:none}}
#updDlg{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#updDlg[hidden]{display:none}
#updDlg .box{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);padding:16px;max-width:380px;width:100%}
#updDlg h3{margin:0 0 6px;font-size:17px}
#updDlg .prog{height:6px;background:#101215;margin:12px 0 4px}
#updDlg .prog i{display:block;height:100%;background:var(--red);transition:width .3s}
.dbf{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.dbf .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dbf .rate{font:800 30px/1 var(--display,var(--font))}
.dbf .verd{font-weight:700;letter-spacing:.08em;font-size:12px}
.dbf .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:12px;margin:8px 0}
.dbf .facts span{color:var(--dim)}.dbf .facts b{color:var(--text);font-variant-numeric:tabular-nums}
.dbf ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.45}
.dbf .pass{font:700 11px var(--mono);padding:2px 6px;border-radius:2px}
.dbf .pass.ok{background:rgba(75,208,127,.15);color:var(--green)}.dbf .pass.no{background:rgba(255,200,69,.14);color:var(--amber)}
.dbhist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dbhist span{font:600 11.5px var(--mono);padding:3px 7px;background:#101215;border:1px solid var(--line)}
.streak{font-size:12.5px;margin-top:8px;color:var(--dim)}.streak b{color:var(--text)}
/* ---------------- moving map ---------------- */
#map{height:340px;background:#0c0d10;border-radius:3px;outline:none}
html[data-design="loadsheet"] #map{border-radius:0}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.maphead .hbtn{background:#101215;border-color:var(--line)}
.maphead .hbtn[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.mapinfo{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.leaflet-container{font-family:var(--font);background:#0c0d10}
.leaflet-control-attribution{font-size:9px!important;background:rgba(12,13,16,.7)!important;color:#8E96A3!important}
.leaflet-control-attribution a{color:#8E96A3!important}
.ac-icon{background:none;border:0}
.leaflet-tooltip.apt-tip{background:#1E2126;color:#E8EAED;border:1px solid #2e3239;font:600 11px var(--mono);box-shadow:none;padding:2px 6px}
.leaflet-tooltip.apt-tip::before{display:none}
</style>
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<script src="/static/leaflet/leaflet.js"></script>
</head>
<body>
<div id="splash" role="status" aria-live="polite"><div class="sp-brand"><img src="/static/pac-wordmark-white.png" alt="PAC"><b>ACARS</b></div>
  <div class="sp-bar" aria-hidden="true"><i></i></div><div class="sp-status" id="spStatus">Starting…</div><div class="sp-ver" id="spVer"></div></div>
<div id="updDlg" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="updTitle"><h3 id="updTitle">Update available</h3><div id="updBody"></div></div></div>
<header><span class="brandblk"><img src="/static/pac-wordmark-white.png" alt="PAC"><b>ACARS</b></span><span class="sp"></span>
  <button class="hbtn msg-light" id="msgLight" type="button" title="New messages from PAC Operations" aria-live="polite">MSG</button>
  <button class="hbtn" id="compactBtn" type="button" title="Compact mode: a slim strip that stays on top">Compact</button>
  <span class="small" id="conn"><span class="dot"></span>…</span></header>
<main>
  <div id="strip" class="strip" role="region" aria-label="Compact flight strip">
    <div class="top"><b id="sFn">PAC</b><span class="muted small" id="sRoute"></span><span class="sp" style="flex:1"></span>
      <button class="hbtn msg-light" id="sMsg" type="button">MSG</button><button class="hbtn" id="sExpand" type="button" title="Back to the full window">Full</button></div>
    <div class="nums"><div><span id="sPhase">Phase</span><b id="sAlt">–</b></div><div><span>IAS / GS</span><b id="sSpd">–</b></div><div><span>V/S</span><b id="sVs">–</b></div><div><span>To go</span><b id="sDtg">–</b></div></div>
    <div class="last" id="sLast">No messages</div>
  </div>
  <div id="update"></div>
  <div id="siteNotice"></div>
  <div id="msg"></div>

  <section class="card" id="flightCard" aria-live="polite"></section>

  <section class="card hidden" id="ofpCard"></section>

  <section class="card" id="controls">
    <div class="row">
      <select id="source" aria-label="Simulator"><option>MSFS</option><option>X-Plane</option><option>Demo</option></select>
      <button class="btn" id="startBtn">Start tracking</button>
      <button class="btn ghost hidden" id="resumeBtn">Resume flight</button>
      <button class="btn ghost hidden" id="stopBtn">Abort</button>
      <button class="btn ghost hidden" id="practiceBtn" type="button" title="Circuits and touch-and-goes at any airport. Every landing is graded; nothing is filed.">Landing practice</button>
      <span class="small" id="simState"></span>
    </div>
    <div class="notice hidden" id="resumeNote" style="margin-top:10px"></div>
  </section>

  <section class="card hidden" id="live">
    <div class="phase"><span class="muted small">Phase</span><b id="phase">–</b><span class="small muted" id="block"></span></div>
    <div class="small" id="waitFor" hidden style="margin:6px 0 2px;padding:7px 10px;border-left:3px solid var(--amber,#E0A100);background:rgba(224,161,0,.08)"></div>
    <div class="grid" style="margin-top:8px">
      <div><span>Altitude</span><b id="alt">–</b></div><div><span>IAS</span><b id="ias">–</b></div><div><span>GS</span><b id="gs">–</b></div>
      <div><span>V/S</span><b id="vs">–</b></div><div><span>Fuel</span><b id="fob">–</b></div><div><span>To go</span><b id="dtg">–</b></div>
    </div>
    <div class="oooi" style="margin-top:8px"><div><span>Out</span><b id="o_out">––––</b></div><div><span>Off</span><b id="o_off">––––</b></div><div><span>On</span><b id="o_on">––––</b></div><div><span>In</span><b id="o_in">––––</b></div></div>
  </section>

  <section class="card hidden" id="mapCard" aria-label="Moving map">
    <div class="maphead"><b>Moving map</b><span class="row" style="gap:6px">
      <button class="hbtn" id="mapFollow" type="button" aria-pressed="true" title="Keep the aircraft in the middle of the map">Follow</button>
      <button class="hbtn" id="mapRoute" type="button" title="Show the whole route">Route</button></span></div>
    <div id="map" role="img" aria-label="Map of the flight: route, flown track and aircraft position"></div>
    <div class="mapinfo" id="mapInfo"></div>
  </section>

  <section class="card hidden" id="debriefCard" aria-live="polite"></section>

  <section class="card hidden" id="comms">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Dispatch</b><button class="btn ghost" id="wxBtn" type="button">WX</button></div>
    <div class="tabs" role="tablist">
      <button data-mt="delay" class="on">Delay</button><button data-mt="divert">Divert</button><button data-mt="fuel">Fuel</button>
      <button data-mt="eta">ETA</button><button data-mt="fault">Fault</button><button data-mt="text">Text</button>
    </div>
    <form class="mform" id="mform"></form>
  </section>

  <section class="card hidden" id="logCard">
    <b>ACARS messages</b>
    <div class="log" id="log" style="margin-top:8px"></div>
  </section>

  <section class="card hidden" id="fileCard"></section>

  <details class="card">
    <summary>Settings</summary>
    <div class="mform" style="margin-top:10px">
      <div class="full"><label for="cfgServer">PAC website address</label><input id="cfgServer" placeholder="https://pac-va.com" spellcheck="false" autocomplete="off">
        <span class="small muted" id="cfgServerHint"></span></div>
      <div><label for="cfgXp">X-Plane address</label><input id="cfgXp"></div>
      <div><label for="cfgDemo">Demo speed-up</label><input id="cfgDemo" type="number" min="1" max="600"></div>
      <label class="full" style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="cfgTop" style="width:auto"> Keep this window on top (native window, after a restart)</label>
      <div class="full"><label for="cfgDesign">Design</label><select id="cfgDesign"><option value="loadsheet">Load Sheet</option><option value="classic">Classic</option></select></div>
      <label class="full" style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="cfgChime" style="width:auto"> Chime for new ACARS messages</label>
      <div><label for="cfgVol">Chime volume</label><input id="cfgVol" type="range" min="0.05" max="1" step="0.05"></div>
      <div style="display:flex;align-items:flex-end"><button class="btn ghost" type="button" id="testChime">Test chime</button></div>
      <label class="full" style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="cfgTray" style="width:auto"> Minimize and close to the tray while a flight is tracked</label>
      <label class="full" style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="cfgCoach" style="width:auto"> SOP coach: reminders from PAC's standard procedures (beacon, lights, stable approach)</label>
      <label class="full" style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="cfgDiscord" style="width:auto"> Show my PAC flight in my Discord status</label>
      <div class="full"><label for="cfgWin">Window (after a restart of PAC ACARS)</label><select id="cfgWin">
        <option value="auto">Automatic (recommended): Edge app window</option><option value="app">Edge or Chrome app window</option><option value="webview">Built-in window</option></select></div>
      <div class="full row"><button class="btn ghost" id="cfgSave" type="button">Save settings</button><span class="small muted" id="ver"></span></div>
      <div class="full row" id="whoRow" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px"><span class="small" id="whoText"></span>
        <button class="btn ghost" type="button" id="signOutApp">Sign out</button></div>
    </div>
  </details>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n == null || isNaN(n) ? "–" : Math.round(n).toLocaleString("en-US");
const PHASES = { PREFLIGHT: "Preflight", PUSHBACK: "Pushback", TAXI_OUT: "Taxi out", TAKEOFF: "Takeoff roll", INITIAL_CLIMB: "Initial climb", CLIMB: "Climb",
  CRUISE: "Cruise", DESCENT: "Descent", APPROACH: "Approach", GO_AROUND: "Go-around", LANDING: "Landing rollout", TAXI_IN: "Taxi in", ARRIVED: "On block" };
let offline = 0, S = {}, pollT = null, lastLogLen = 0, cfgLoaded = false, pickedSource = false, shownServer = null;  // pickedSource: the pilot chose a simulator by hand

async function api(path, body) {
  // every request has a time limit, so nothing in the window can ever hang waiting for an answer
  const ctl = new AbortController(), limit = setTimeout(() => ctl.abort(), body === undefined ? 5000 : 25000);
  try {
    const res = await fetch(path, { signal: ctl.signal, ...(body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    return data;
  } catch (e) {

  const oc = $("#ofpCard"), ok = bk ? JSON.stringify([bk.flight_number, bk.ofp?.request_id, !!bk.ofp, !!(st && st.tracking && st.phase !== "PREFLIGHT")]) : "";
  oc.classList.toggle("hidden", !bk || !!S.result);
  if (bk && ok !== lastOfpKey) { lastOfpKey = ok; oc.innerHTML = ofpCard(bk); const b = $("#ofpBtn"); if (b) { b.onclick = fetchOfp; b.disabled = !!(st && st.tracking && st.phase !== "PREFLIGHT"); } }
  // compact strip
  const l0 = st?.live || {};
  $("#sFn").textContent = bk ? bk.flight_number : "PAC ACARS";
  $("#sRoute").textContent = bk ? `${bk.mission.origin.icao}–${bk.mission.destination.icao}` : "";
  $("#sPhase").textContent = st ? (PHASES[st.phase] || st.phase) : "Not tracking";
  $("#sAlt").textContent = l0.alt_ft != null ? fmt(l0.alt_ft) : "–";
  $("#sSpd").textContent = l0.ias != null ? `${fmt(l0.ias)}/${fmt(l0.gs)}` : "–";
  $("#sVs").textContent = l0.vs_fpm != null ? (l0.vs_fpm > 0 ? "+" : "") + fmt(l0.vs_fpm) : "–";
  $("#sDtg").textContent = st?.dtg_nm != null ? fmt(st.dtg_nm) : "–";
  const lastUp = upl[upl.length - 1];
  $("#sLast").textContent = lastUp ? `${lastUp.z} ${lastUp.text}` : (st ? "No messages yet" : "Start tracking in the full window");
  $("#whoText").textContent = S.signed_in_as ? `Signed in as ${S.signed_in_as.name} (${S.signed_in_as.id})` : "Not signed in";
  $("#signOutApp").hidden = !S.signed_in_as;
  $("#conn").innerHTML = S.server_ok ? `<span class="dot ok"></span>PAC website` : `<span class="dot bad"></span>Website offline`;
  if (cfg.server !== shownServer && document.activeElement !== $("#cfgServer")) { $("#cfgServer").value = cfg.server || ""; shownServer = cfg.server; }
  const nonDefault = S.default_server && cfg.server !== S.default_server;
  $("#cfgServerHint").innerHTML = nonDefault ? `PAC's website is ${esc(S.default_server)}. <a href="#" style="color:var(--cyan)" onclick="useDefaultSite();return false">Use it</a>` : "";
  $("#siteNotice").innerHTML = S.site_notice ? `<div class="notice"><span>${esc(S.site_notice)}</span> <a href="#" style="color:var(--cyan)" onclick="dismissNotice();return false">OK</a></div>` : "";
  if (!cfgLoaded) { $("#cfgXp").value = cfg.xplane_host || ""; $("#cfgDemo").value = cfg.demo_speedup || 60; $("#cfgTop").checked = !!cfg.always_on_top; $("#source").value = cfg.source || "MSFS";
    $("#cfgWin").value = cfg.window_mode || "auto";
    $("#cfgDesign").value = cfg.design || "loadsheet";
    $("#cfgChime").checked = cfg.chime !== false; $("#cfgVol").value = cfg.chime_volume ?? 0.5; $("#cfgTray").checked = cfg.close_to_tray !== false; $("#cfgCoach").checked = cfg.sop_coach !== false; $("#cfgDiscord").checked = cfg.discord_status !== false; $("#ver").textContent = `PAC ACARS ${S.version}`; cfgLoaded = true; }
  if (S.auth_needed && !st) {
    if (!$("#appSignin")) {
      $("#flightCard").innerHTML = `<form id="appSignin" class="mform"><b class="full" style="font-size:16px">Sign in to PAC</b>
        <p class="full muted small" style="margin:0">PAC ACARS signs in once with your pilot ID and password, then stays signed in.</p>
        <div><label for="asId">Pilot ID</label><input id="asId" autocomplete="username" placeholder="PAC0001" style="text-transform:uppercase" required></div>
        <div><label for="asPw">Password</label><input id="asPw" type="password" autocomplete="current-password" required></div>
        <div class="full"><button class="btn" type="submit">Sign in</button></div>
        <p class="full muted small" style="margin:0">No password yet? Sign in on the PAC website first (or ask staff for a sign-in link).</p></form>`;
      $("#appSignin").onsubmit = async e => {
        e.preventDefault();
        await busy(e.target.querySelector("button"), "Signing in…", async () => {
          try { const r = await api("/api/login", { pilot_id: $("#asId").value.trim(), password: $("#asPw").value }); note(`Signed in as ${esc(r.pilot.name)}.`, "ok"); poll(); }
          catch (err) { note(esc(err.message), "err"); }
        });
      };
    }
  } else if (!S.server_ok && !st) {
    const offer = S.default_server && cfg.server !== S.default_server;
    $("#flightCard").innerHTML = `<b>Can't reach the PAC website</b><p class="small" style="margin:6px 0 4px">${esc(S.server_error || "")}</p>
      ${offer ? `<p class="muted small" style="margin:0 0 4px">PAC's website is ${esc(S.default_server)}.</p>` : ""}
      ${S.server_detail ? `<p class="muted small" style="margin:0 0 10px;opacity:.7">Details: ${esc(S.server_detail)}</p>` : `<div style="height:6px"></div>`}
      <div class="row">${offer ? `<button class="btn" onclick="useDefaultSite()">Use ${esc(S.default_server.replace(/^https?:\/\//, ""))}</button>` : ""}<button class="btn ghost" onclick="refresh()">Try again</button></div>`;
  } else if (S.result) {
    const r = S.result;
    $("#flightCard").innerHTML = `${landingCard(r)}<div class="row" style="gap:14px"><div class="grade">${esc(r.grade || "")}</div><div><b style="font-size:17px">${esc(r.flight_number || "")} filed</b><br>
      <span class="muted small">${esc(r.score ?? "")}/100 · ${fmt(r.points)} points${r.paid ? ` · $${fmt(r.paid.total)} paid` : ""}${r.review_status === "Pending" ? " · waiting for staff review" : ""}</span></div></div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="done()">Next flight</button><a class="btn ghost" href="${esc(cfg.server)}/#logbook" target="_blank" rel="noopener">Open logbook</a></div>`;
  } else if (S.practice || st?.practice) {
    const n = (S.debriefs || []).length;
    $("#flightCard").innerHTML = `<div class="flight"><div><div class="fn">PRACTICE</div><div class="muted small">Landing practice${st?.practice_airport ? " at " + esc(st.practice_airport) : ""}</div></div>
      <div style="text-align:right"><div class="route">${n} landing${n === 1 ? "" : "s"}</div><div class="muted small">Graded here · nothing is filed</div></div></div>
      <p class="muted small" style="margin:8px 0 0">Fly circuits or touch-and-goes. About 40 seconds after each touchdown you get a debrief below. Press Stop practice when you're done.</p>`;
  } else if (!bk) {
    $("#flightCard").innerHTML = `<b>No flight booked</b><p class="muted small" style="margin:6px 0 10px">Book a flight on the PAC website, then refresh here.</p>
      <div class="row"><button class="btn ghost" onclick="refresh()">Refresh</button><a class="btn ghost" href="${esc(cfg.server)}/#missions" target="_blank" rel="noopener">Open mission board</a></div>`;
  } else {
    const m = bk.mission, ac = h.aircraft || {};
    $("#flightCard").innerHTML = `<div class="flight"><div><div class="fn">${esc(bk.flight_number)}</div><div class="muted small">${esc(m.title)}</div></div>
      <div style="text-align:right"><div class="route">${esc(m.origin.icao)} → ${esc(m.destination.icao)}</div><div class="muted small">${esc(ac.name || bk.aircraft)}${bk.airframe ? " · " + esc(bk.airframe) : ""}${m.operator ? " · " + esc(m.operator.callsign) : ""}</div></div></div>
      <div class="row small muted" style="margin-top:8px"><span>${fmt(m.payload_lbs)} lb ${esc(m.cargo || "")}</span><span style="flex:1"></span><a style="color:var(--cyan)" href="${esc(cfg.server)}/dispatch" target="_blank" rel="noopener">Dispatch release</a></div>`;
  }
  const tracking = !!(st && st.tracking), have = !!st;
  const practicing = !!S.practice;
  $("#startBtn").classList.toggle("hidden", practicing || tracking || !bk || !!S.result || (have && st.complete) || !!S.resumable);
  $("#practiceBtn").classList.toggle("hidden", practicing || tracking || !!S.result || !!S.resumable || (have && !st.complete));
  $("#resumeBtn").classList.toggle("hidden", !S.resumable || tracking || !!S.result);
  const sv = S.saved, rn = $("#resumeNote");
  rn.classList.toggle("hidden", !(S.resumable && !tracking && sv));
  if (sv) rn.innerHTML = `This flight is under way: saved in <b>${esc(PHASES[sv.phase] || sv.phase)}</b> at ${new Date(sv.at * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} on ${esc(sv.where)}${sv.source ? ` (${esc(sv.source)})` : ""}. Load the aircraft where you left off in the simulator, check the simulator below, then press <b>Resume flight</b>. <b>Abort</b> discards it.`;
  // simulator: follow the detected one (or the last used for this type) until the pilot picks one
  if (!tracking && !pickedSource && S.suggested_source && $("#source").value !== S.suggested_source) $("#source").value = S.suggested_source;
  const why = !pickedSource && $("#source").value === S.suggested_source ? ({ detected: `${S.suggested_source} detected`, "last used": "last used for this aircraft" }[S.suggested_why] || "") : "";
  $("#stopBtn").classList.toggle("hidden", !(have || S.resumable || practicing) || !!S.result || S.handed_over);
  $("#stopBtn").textContent = practicing ? "Stop practice" : "Abort";
  $("#source").disabled = tracking;
  $("#simState").innerHTML = tracking ? (st.connected ? `<span class="dot ok"></span>${esc(S.source)} connected` : st.error ? `<span class="dot bad"></span>${esc(st.error)}` : `<span class="dot warn"></span>Connecting to ${esc(S.source)}…`)
    : why ? `<span class="muted">${esc(why)}</span>` : "";
  for (const id of ["live", "comms", "logCard"]) $("#" + id).classList.toggle("hidden", !have || (id === "comms" && !!st?.practice));
  renderDebriefs();
  if (have) {
    const l = st.live || {};
    $("#phase").textContent = PHASES[st.phase] || st.phase || "–";
    const age = st.data_age, stale = st.tracking && st.connected && age != null && age > 5;
    const wf = stale ? `No data from the simulator for ${Math.round(age)} s. Is the sim paused on a menu, or is another program using its data port?`
      : st.tracking ? st.waiting_for : null;
    $("#waitFor").hidden = !wf; if (wf) $("#waitFor").textContent = wf;
    $("#block").textContent = st.block_elapsed_s ? `Block ${Math.floor(st.block_elapsed_s / 3600)}:${String(Math.floor(st.block_elapsed_s % 3600 / 60)).padStart(2, "0")}` : "";
    $("#alt").textContent = l.alt_ft != null ? fmt(l.alt_ft) : "–"; $("#ias").textContent = fmt(l.ias); $("#gs").textContent = fmt(l.gs);
    $("#vs").textContent = l.vs_fpm != null ? (l.vs_fpm > 0 ? "+" : "") + fmt(l.vs_fpm) : "–"; $("#fob").textContent = fmt(l.fuel_lbs); $("#dtg").textContent = st.dtg_nm != null ? fmt(st.dtg_nm) + " nm" : "–";
    const o = st.oooi || {}; $("#o_out").textContent = zulu(o.out); $("#o_off").textContent = zulu(o.off); $("#o_on").textContent = zulu(o.on); $("#o_in").textContent = zulu(o.in);
    const msgs = st.messages || [], count = st.msg_count ?? msgs.length;
    if (count !== lastLogLen) {
      const log = $("#log"), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
      const row = m => `<div><span class="z">${m.z}</span><span class="${m.kind === "phase" ? "phase-m" : m.kind === "oooi" ? "oooi-m" : m.kind === "warn" ? "warn" : m.kind === "wx" ? "wx" : m.kind === "dl" ? "dl" : m.kind === "ul" ? "ul" : ""}">${esc(m.text)}</span></div>`;
      const fresh = count - lastLogLen;
      if (lastLogLen > 0 && fresh > 0 && fresh <= msgs.length) {
        log.insertAdjacentHTML("beforeend", msgs.slice(-fresh).map(row).join(""));   // only the new lines
        while (log.children.length > 150) log.firstElementChild.remove();
      } else {
        log.innerHTML = msgs.map(row).join("");                                     // first time, or a new flight
      }
      if (atEnd || !lastLogLen) log.scrollTop = log.scrollHeight;
      lastLogLen = count;
    }
  }
  try { mapUpdate(bk, st); } catch (e) { console.warn("map", e); }
  const fc = $("#fileCard");
  if (st?.practice || S.practice) { fc.classList.add("hidden"); fc.dataset.shown = ""; }
  else if (have && (st.complete || S.handed_over) && !S.result) {
    const d = S.draft;
    fc.classList.remove("hidden");
    if (!fc.dataset.shown) {
      fc.dataset.shown = "1";
      fc.innerHTML = `<b>On block</b>${d ? `${landingCard(d)}<div class="row" style="gap:12px;margin:4px 0 8px"><span class="gbadge">${esc(d.grade)}</span><div class="small">${d.score}/100 · ${fmt(d.points)} points${d.pay ? ` · pay $${fmt(d.pay.total)}` : ""}<br><span class="muted">${esc(d.status)}${d.review_status === "Pending" ? " · will go to staff review" : ""}</span></div></div>` : `<p class="muted small">Sending the flight to the website…</p>`}
        <textarea id="remarks" rows="2" style="width:100%" placeholder="Remarks for dispatch (optional)"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" id="fileBtn">File PIREP</button><a class="btn ghost" href="${esc(cfg.server)}/#acars" target="_blank" rel="noopener">Full report on the website</a></div>`;
      $("#fileBtn").onclick = filePirep;
    } else if (d && !fc.dataset.draft) { fc.dataset.shown = ""; fc.dataset.draft = "1"; render(); }
  } else if (have && st.tracking && (st.oooi || {}).on && !st.complete && !S.handed_over && !S.result) {
    fc.classList.remove("hidden"); fc.dataset.draft = "";
    if (fc.dataset.shown !== "anyway") {
      fc.dataset.shown = "anyway";
      fc.innerHTML = `<b>Landed</b><p class="muted small" style="margin:4px 0 8px">The flight ends at the stand: parking brake set, engines off. If PAC ACARS doesn't go on block with your aircraft, you can file anyway. That PIREP goes to staff review.</p>
        <button class="btn ghost" id="anywayBtn">File anyway</button>`;
      $("#anywayBtn").onclick = fileAnyway;
    }
  } else { fc.classList.add("hidden"); fc.dataset.shown = ""; fc.dataset.draft = ""; }
}

async function poll() {
  clearTimeout(pollT);
  try { S = await api("/api/state"); render(); offline = 0; $("#reconnect")?.remove(); }
  catch (e) {   /* app busy or restarting (an update): say so after a few seconds and keep trying */
    if (++offline === 4 && !$("#reconnect")) document.body.insertAdjacentHTML("beforeend", `<div id="reconnect" role="status" style="position:fixed;inset:0;z-index:9998;background:rgba(21,23,27,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 15px var(--font);color:#fff"><img src="/static/pac-wordmark-white.png" alt="PAC" style="height:34px">${S.update?.state === "installing" ? "Installing the update…" : "Reconnecting to PAC ACARS…"}<span style="font:500 12px var(--mono);color:var(--dim)">This window reconnects by itself.</span></div>`);
  }
  finally { pollT = setTimeout(poll, 1000); }
}
async function useDefaultSite() { try { S = await api("/api/site/default", {}); render(); } catch (e) { note(esc(e.message), "err"); } }
async function dismissNotice() { await api("/api/notice/dismiss", {}); S.site_notice = null; render(); }
async function refresh() { try { S = await api("/api/refresh", {}); render(); } catch (e) { note(esc(e.message), "err"); } }
async function start(resume = false) {
  const btn = resume ? $("#resumeBtn") : $("#startBtn");
  if (btn.disabled) return;
  btn.disabled = true; setTimeout(() => { btn.disabled = false; }, 4000);
  try { const r = await api("/api/start", { source: $("#source").value, resume }); note(r.warning ? esc(r.warning) : resume ? "Flight resumed." : "Tracking started. Your flight appears live on the PAC website.", r.warning ? "" : "ok"); lastLogLen = 0; poll(); }
  catch (e) { note(esc(e.message), "err"); }
}
async function done() { await api("/api/done", {}); S.result = null; refresh(); }
async function fileAnyway() {
  if (!confirm("File this flight now, without going on block?\n\nUse this only if PAC ACARS won't go on block with your aircraft. The PIREP goes to staff review.")) return;
  const btn = $("#anywayBtn"); btn.disabled = true;
  try { const r = await api("/api/file", { force: true, remarks: "Filed with File anyway: PAC ACARS did not detect on block." }); note(`PIREP filed: ${esc(r.result.flight_number)} graded ${esc(r.result.grade)}. It goes to staff review.`, "ok"); poll(); }
  catch (e) { note(esc(e.message), "err"); btn.disabled = false; }
}
async function filePirep() {
  const btn = $("#fileBtn"); btn.disabled = true;
  try { const r = await api("/api/file", { remarks: $("#remarks").value }); note(`PIREP filed: ${esc(r.result.flight_number)} graded ${esc(r.result.grade)}.`, "ok"); poll(); }
  catch (e) { note(esc(e.message), "err"); btn.disabled = false; }
}
$("#startBtn").onclick = () => start(false);
$("#mapFollow").onclick = () => { MAP.follow = !MAP.follow; $("#mapFollow").setAttribute("aria-pressed", String(MAP.follow)); if (MAP.follow && MAP.plane) MAP.map.panTo(MAP.plane.getLatLng()); };
$("#mapRoute").onclick = () => { MAP.follow = false; $("#mapFollow").setAttribute("aria-pressed", "false"); mapFitRoute(); };
$("#source").onchange = () => { pickedSource = true; };
$("#msgLight").onclick = () => { ack(); const l = $("#log"); if (l) { l.scrollTop = l.scrollHeight; $("#logCard").scrollIntoView({ behavior: "smooth", block: "nearest" }); } };
$("#sMsg").onclick = ack;
$("#compactBtn").onclick = () => setCompact(true);
$("#sExpand").onclick = () => setCompact(false);  // (the engine's tray menu can switch it too)
$("#testChime").onclick = () => chime(true);
$("#signOutApp").onclick = async () => { try { await api("/api/logout", {}); note("Signed out of PAC ACARS."); poll(); } catch (e) { note(esc(e.message), "err"); } };
$("#resumeBtn").onclick = () => start(true);
$("#stopBtn").onclick = async () => {
  if (S.practice) { await api("/api/practice/stop", {}); lastLogLen = 0; note("Landing practice finished. Your debriefs stay below until you start a flight."); poll(); return; }
  if (!confirm("Abort this flight? Nothing will be filed.")) return; await api("/api/stop", {}); lastLogLen = 0; note("Flight aborted."); poll(); };
$("#practiceBtn").onclick = () => busy($("#practiceBtn"), "Starting…", async () => {
  try { await api("/api/practice/start", { source: $("#source").value }); lastLogLen = 0; note("Landing practice started. Every landing gets a debrief; nothing is filed.", "ok"); poll(); }
  catch (e) { note(esc(e.message), "err"); } });
$("#wxBtn").onclick = e => busy(e.currentTarget, "WX…", async () => {
  try { const r = await api("/api/wx", {}); note(`Weather requested for ${esc((r.stations || []).join(" and "))}. It arrives in the ACARS log in a few seconds.`); }
  catch (err) { note(esc(err.message), "err"); }
});
$("#cfgSave").onclick = async () => { if ($("#cfgSave").disabled) return; $("#cfgSave").disabled = true; setTimeout(() => { $("#cfgSave").disabled = false; }, 1500);
  const before = (S.config || {}).server; let r;
  try { r = await api("/api/config", { server: $("#cfgServer").value.trim(), xplane_host: $("#cfgXp").value.trim(), demo_speedup: +$("#cfgDemo").value || 60, always_on_top: $("#cfgTop").checked,
  window_mode: $("#cfgWin").value, design: $("#cfgDesign").value, chime: $("#cfgChime").checked, chime_volume: +$("#cfgVol").value, close_to_tray: $("#cfgTray").checked,
  sop_coach: $("#cfgCoach").checked, discord_status: $("#cfgDiscord").checked }); } catch (e) { note(esc(e.message), "err"); return; }
  note(r.config.server !== before ? `Settings saved. PAC ACARS now uses ${esc(r.config.server)}: sign in there.` : "Settings saved.", "ok"); shownServer = null; refresh(); };

const ATA = [[5, "Inspections"], [21, "Air conditioning / pressurization"], [22, "Autoflight"], [23, "Communications"], [24, "Electrical"], [26, "Fire protection"],
  [27, "Flight controls"], [28, "Fuel"], [29, "Hydraulics"], [30, "Ice and rain"], [31, "Indicating"], [32, "Landing gear and brakes"], [33, "Lights"],
  [34, "Navigation"], [36, "Pneumatic"], [49, "APU"], [50, "Cargo compartments"], [52, "Doors"], [53, "Fuselage"], [71, "Power plant"], [80, "Engine starting"]];
const FORMS = {
  delay: `<div><label for="f1">Minutes</label><input id="f1" name="minutes" type="number" min="1" max="600" value="15"></div><div><label for="f2">Cause</label><select id="f2" name="reason"><option>ATC</option><option>WEATHER</option><option>GROUND HANDLING</option><option>LATE CARGO</option><option>TECHNICAL</option></select></div>`,
  divert: `<div><label for="f1">Airport (ICAO)</label><input id="f1" name="icao" maxlength="4" style="text-transform:uppercase"></div><div><label for="f2">Reason</label><select id="f2" name="reason"><option>WEATHER</option><option>MEDICAL</option><option>TECHNICAL</option><option>FUEL</option><option>SECURITY</option><option>RUNWAY CLOSED</option></select></div>`,
  fuel: `<p class="full small muted" style="margin:0">Sends your fuel on board; dispatch compares it with your OFP.</p>`,
  eta: `<p class="full small muted" style="margin:0">Asks dispatch for your ETA.</p>`,
  fault: `<div class="full"><label for="f1">System</label><select id="f1" name="ata">${ATA.map(([n, l]) => `<option value="${n}" ${n === 49 ? "selected" : ""}>ATA ${String(n).padStart(2, "0")} · ${l}</option>`).join("")}</select></div>
    <div class="full"><label for="f2">Fault</label><input id="f2" name="description" maxlength="300" placeholder="What's wrong"></div>
    <div><label for="f3">Keep flying?</label><select id="f3" name="severity"><option value="deferred">Yes, defer it</option><option value="grounding">No, ground it</option></select></div>
    <div><label for="f4">Fix within</label><select id="f4" name="category"><option value="C">10 days (C)</option><option value="B">3 days (B)</option></select></div>`,
  text: `<div class="full"><label for="f1">Message</label><input id="f1" name="text" maxlength="160" placeholder="e.g. Request stand"></div>`,
};
function drawForm(t) {
  document.querySelectorAll("[data-mt]").forEach(b => b.classList.toggle("on", b.dataset.mt === t));
  const f = $("#mform"); f.dataset.type = t;
  f.innerHTML = FORMS[t] + `<div class="full"><button class="btn" type="submit">Send</button></div>`;
}
document.querySelectorAll("[data-mt]").forEach(b => b.onclick = () => drawForm(b.dataset.mt));
$("#mform").onsubmit = async e => {
  e.preventDefault();
  const f = e.target, body = { type: f.dataset.type, ...Object.fromEntries(new FormData(f).entries()) };
  await busy(f.querySelector("button[type=submit]"), "Sending…", async () => {
    try { await api("/api/message", body); note("Sent. PAC Operations will reply in the log."); drawForm(f.dataset.type); } catch (err) { note(esc(err.message), "err"); }
  });
};
drawForm("delay");
refresh().then(poll);
</script>
