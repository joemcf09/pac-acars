name: Flight debrief regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flight-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_acars_config_capture.py tests/test_flight_timing.py tests/test_mission_worker_data.py
      - run: python tests/test_flights.py
      - run: python tests/test_pirep_retry.py
      - run: python tests/test_a330_p2f.py
      - run: python tests/test_runway_cache.py
